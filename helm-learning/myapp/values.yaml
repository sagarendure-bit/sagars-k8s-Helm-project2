# Default values for myapp.

replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  pullPolicy: IfNotPresent
  tag: "1.25-alpine"   # defaults to .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: myapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# App-level config rendered into a ConfigMap
config:
  APP_ENV: "default"
  LOG_LEVEL: "info"
  FEATURE_FLAG: "false"

# Sensitive values rendered into a Secret (base64 handled by template)
secrets:
  API_KEY: "change-me"
  DB_PASSWORD: "change-me"

# Hook: pre-upgrade migration job
migrationJob:
  enabled: true
  image: busybox:1.36
  backoffLimit: 2
  ttlSecondsAfterFinished: 300

# Dependency (Phase 8) — disabled by default
postgresql:
  enabled: false

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: default
  hostnames:
    - myapp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: myapp
          port: 80
