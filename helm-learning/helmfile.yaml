repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: myrel
    namespace: helm-lab
    createNamespace: true
    chart: ./myapp
    values:
      - ./myapp/values-dev.yaml
    wait: false
    timeout: 600

  - name: pkgtest
    namespace: pkgtest
    createNamespace: true
    chart: ./dist/myapp-0.1.0.tgz
    values:
      - ./myapp/values-dev.yaml
    wait: false
    timeout: 600
