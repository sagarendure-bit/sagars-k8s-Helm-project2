apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devopscrd.sagar.endure.com
spec:
  group: sagar.endure.com
  names:
    plural: devopscrd
    singular: devops
    kind: DevOps
    shortNames:
      - dv
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: This is DevOps name
                duration:
                  type: string
                  description: This is duration
                mode:
                  type: string
                  description: Mode type
                platform:
                  type: string
                  description: Platform name
